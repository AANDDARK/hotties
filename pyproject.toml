[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hotties"
version = "0.1.0"
requires-python = ">=3.10"

[project.scripts]
hotties = "main:main"

[tool.setuptools]
py-modules = ["main", "state", "watcher", "list_all"]
packages = ["model", "use_cases"]